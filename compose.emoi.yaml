# Single-instance backend. Put HTTPS in front of the loopback-only published port.
services:
  emoi:
    build:
      context: .
      dockerfile: Dockerfile.emoi
    restart: "on-failure:5"
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${EMOI_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      RELAY_SECRET: ${RELAY_SECRET:?Set RELAY_SECRET in the private .env file}
      PORT: "8080"
      RELAY_DB: /data/emoi.db
      RELAY_UPLOAD_DIR: /data/uploads
      LOOP_CONFIG: /data/api_loop.config.json
      LOOP_CACHE_DIR: /data/loop_cache
      RELAY_BRAIN_FILE: /data/brain_target
      RELAY_DEFAULT_BRAIN: loop
      RELAY_APP_PATH: /
      EMOI_LATENT_AUTO_SETUP: "1"
      EMOI_LATENT_SOURCE: /data/emoi-private/latent-source
      EMOI_PASSIVE_MODEL_CACHE: /data/emoi-private/latent-models
      EMOI_PASSIVE_STATE_DIR: /data/emoi-private/passive-state
      EMOI_LATENT_FULL_DIR: /data/emoi-private/latent-full
      EMOI_OMBRE_AUTO_SETUP: "1"
      EMOI_OMBRE_SOURCE: /data/emoi-private/ombre/source
      EMOI_OMBRE_DIR: /data/emoi-private/ombre
      EMOI_FOLIO_AUTO_SETUP: "1"
      EMOI_FOLIO_SOURCE: /data/emoi-private/ombre/folio-source
      EMOI_XINCHAO_AUTO_SETUP: "1"
      EMOI_XINCHAO_SOURCE: /data/emoi-private/xinchao/source
    volumes:
      - emoi_data:/data
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request;assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=4))['ok']"]
      interval: 15s
      timeout: 5s
      start_period: 5m
      retries: 3
volumes:
  emoi_data:
