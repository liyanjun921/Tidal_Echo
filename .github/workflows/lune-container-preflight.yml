name: Luné container preflight

on:
  push:
    branches: [codex/lune-v04-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build the release image
        run: docker build -f Dockerfile.lune -t lune:preflight .
      - name: Check initial routing and saved override
        run: |
          docker run --rm \
            -e RELAY_SECRET=ci-preflight-only \
            -v "$PWD/tests:/app/tests:ro" \
            lune:preflight \
            python -m unittest discover -s tests -p test_lune.py -k BrainRouteTests
      - name: Start a fresh persistent volume
        run: |
          docker volume create lune-preflight
          docker run -d --name lune-preflight \
            -p 127.0.0.1:18080:8080 \
            -v lune-preflight:/data \
            -e RELAY_SECRET=ci-preflight-only \
            -e RELAY_DEFAULT_BRAIN=loop \
            lune:preflight
      - name: Verify readiness, routing, and authentication
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/readyz | grep -q '"ok":true'; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/readyz | grep -q '"ok":true'
          curl --fail --silent http://127.0.0.1:18080/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/relay/app/brain)" = 401
          curl --fail --silent -H 'Authorization: Bearer ci-preflight-only' \
            http://127.0.0.1:18080/relay/app/brain | grep -q '"target":"loop"'
      - name: Inspect failures and remove test data
        if: always()
        run: |
          if [ "${{ job.status }}" != success ]; then docker logs --tail 100 lune-preflight 2>/dev/null || true; fi
          docker rm -f lune-preflight 2>/dev/null || true
          docker volume rm lune-preflight 2>/dev/null || true
