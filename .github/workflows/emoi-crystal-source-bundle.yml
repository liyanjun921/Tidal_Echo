name: Crystal Glass local browser source package
on:
  push:
    branches:
      - design/emoi-crystal-glass-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Crystal branch
        uses: actions/checkout@v4
      - name: Upload exact frontend source for local visual verification
        uses: actions/upload-artifact@v4
        with:
          name: emoi-crystal-exact-web-source
          path: web/
          if-no-files-found: error
          compression-level: 6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install selenium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check wallpaper refraction and phone navigation
        env:
          EMOI_SCREENSHOT_DIR: ${{ runner.temp }}/emoi-phone-views
        run: python tests/run_phone_browser.py
      - name: Upload phone and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emoi-clear-home-screenshots
          path: ${{ runner.temp }}/emoi-phone-views/*.png
          if-no-files-found: ignore
