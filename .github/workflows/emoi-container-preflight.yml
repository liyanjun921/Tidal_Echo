name: Émoi container preflight

on:
  push:
    branches: [main, codex/emoi-internal-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check quick-start shell and lightweight Compose overlay
        run: |
          bash -n scripts/deploy_emoi_tencent_light.sh
          bash -n scripts/deploy_emoi_xlc_https.sh
          printf 'RELAY_SECRET=ci-lightweight-example-only\nEMOI_PORT=18088\n' > .env
          docker compose -p emoi -f compose.emoi.yaml -f compose.emoi.light.yaml config --quiet
          docker compose -p emoi -f compose.emoi.yaml -f compose.emoi.light.yaml -f compose.emoi.xlc.yaml config --quiet
          docker compose -p emoi -f compose.emoi.yaml -f compose.emoi.light.yaml config --format json | python3 -c 'import json,sys; e=json.load(sys.stdin)["services"]["emoi"]["environment"]; assert e["EMOI_OMBRE_SOURCE"] == "" and e["EMOI_XINCHAO_SOURCE"] == ""; assert all(e[k] == "0" for k in ("EMOI_LATENT_AUTO_SETUP","EMOI_OMBRE_AUTO_SETUP","EMOI_FOLIO_AUTO_SETUP","EMOI_XINCHAO_AUTO_SETUP"))'
          rm .env
      - name: Build the release image
        run: docker build -f Dockerfile.emoi -t emoi:preflight .
      - name: Check initial routing and saved override
        run: |
          docker run --rm \
            -e RELAY_SECRET=ci-preflight-only \
            -v "$PWD/tests:/app/tests:ro" \
            emoi:preflight \
            python -m unittest discover -s tests -p test_emoi.py -k BrainRouteTests
      - name: Start a fresh persistent volume
        run: |
          docker volume create emoi-preflight
          docker run -d --name emoi-preflight \
            -p 127.0.0.1:18080:8080 \
            -v emoi-preflight:/data \
            -e RELAY_SECRET=ci-preflight-only \
            -e RELAY_DEFAULT_BRAIN=loop \
            emoi:preflight
      - name: Verify readiness, routing, and authentication
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/readyz | grep -q '"ok":true'; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/readyz | grep -q '"ok":true'
          curl --fail --silent http://127.0.0.1:18080/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/relay/app/brain)" = 401
          curl --fail --silent -H 'Authorization: Bearer ci-preflight-only' \
            http://127.0.0.1:18080/relay/app/brain | grep -q '"target":"loop"'
      - name: Smoke-test Room preset, scope isolation, and durable event inbox
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base = "http://127.0.0.1:18080/relay"
          token = "Bearer ci-preflight-only"
          def call(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  base + path, data=data, method=method,
                  headers={"Authorization": token, "Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=5) as response:
                  return json.load(response)
          before = call("/emoi/wren/gpt")
          other = call("/emoi/wren/claude")
          assert before["settings"]["enabled"] is False
          assert other["settings"]["enabled"] is False
          call("/emoi/wren/gpt/preset/high-affection", "POST",
               {"version": before["settings"]["version"]})
          after = call("/emoi/wren/gpt")
          assert after["settings"]["enabled"] is True
          assert (after["settings"]["idle_min"], after["settings"]["idle_max"]) == (1800, 1800)
          assert after["settings"]["daily_limit"] == 40
          assert (after["settings"]["quiet_start"], after["settings"]["quiet_end"]) == (1, 9)
          assert after["settings"]["desire"]["enabled"] is True
          assert call("/emoi/wren/claude")["settings"]["enabled"] is False
          event = {
              "source": "system", "event_id": "container-preflight-event",
              "type": "system.preflight", "summary": "容器内持久唤醒队列验收。",
              "resource_ref": "preflight:1", "priority": 80,
              "not_before": time.time() + 3600, "ttl_seconds": 86400
          }
          first = call("/emoi/wren/gpt/events", "POST", event)
          duplicate = call("/emoi/wren/gpt/events", "POST", event)
          assert first["ok"] and not first["duplicate"]
          assert duplicate["ok"] and duplicate["duplicate"]
          snapshot = call("/emoi/wren/gpt")
          stored = next(x for x in snapshot["wake_events"] if x["id"] == first["id"])
          assert stored["state"] == "pending"
          assert stored["summary"] == event["summary"]
          print("Room 30-minute preset, independent scope, and durable wake inbox: OK")
          PY
      - name: Inspect failures and remove test data
        if: always()
        run: |
          if [ "${{ job.status }}" != success ]; then docker logs --tail 100 emoi-preflight 2>/dev/null || true; fi
          docker rm -f emoi-preflight 2>/dev/null || true
          docker volume rm emoi-preflight 2>/dev/null || true

  phone-visual-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'design/emoi-dual-mode-phone-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chinese font and browser driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install selenium fastapi==0.137.1 httpx==0.28.1
          fc-cache -f >/dev/null
      - name: Test authenticated dynamic multi-AI scopes
        run: python -m unittest discover -s tests -p test_emoi_contacts_v2.py -v
      - name: Check small-phone UI, contacts and both display modes
        env:
          EMOI_SCREENSHOT_DIR: ${{ runner.temp }}/emoi-phone-views
        run: python tests/run_phone_browser.py
      - name: Upload real browser screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emoi-phone-ui-real-screenshots
          path: ${{ runner.temp }}/emoi-phone-views/*.png
          if-no-files-found: ignore
