name: Luné unified wake tests

on:
  push:
    branches: [codex/lune-v04-integration]
  pull_request:
    paths:
      - "backend/lune_wake.py"
      - "backend/lune_wren.py"
      - "backend/lune_desire.py"
      - "tests/test_wake_orchestrator.py"
      - "tests/test_wren.py"
      - ".github/workflows/lune-wake-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test durable wake inbox
        run: python -m unittest discover -s tests -p "test_wake_orchestrator.py" -v
      - name: Test Room scheduler and desire integration
        run: python -m unittest discover -s tests -p "test_wren.py" -v
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
