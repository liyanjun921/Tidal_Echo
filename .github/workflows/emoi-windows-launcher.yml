name: Emoi Windows launcher validation

on:
  push:
    branches: [main, codex/emoi-windows-validation]
  pull_request:
    paths:
      - "Emoi-*.cmd"
      - "scripts/windows/**"
      - "tests/test_windows_launcher.ps1"
      - ".gitattributes"
      - ".github/workflows/emoi-windows-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows launcher encodings and line endings
        shell: powershell
        run: |
          $cmdFiles = @('Emoi-Start.cmd','Emoi-Phone.cmd','Emoi-Stop.cmd','Emoi-Access.cmd')
          foreach ($name in $cmdFiles) {
            $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD $name))
            if ($bytes.Length -eq 0 -or ($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$name must be non-empty ASCII without a BOM."
            }
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10 -and ($i -eq 0 -or $bytes[$i - 1] -ne 13)) {
                throw "$name contains LF without CR; expected CRLF."
              }
            }
          }
          $psPath = Join-Path $PWD 'scripts/windows/emoi.ps1'
          $psBytes = [IO.File]::ReadAllBytes($psPath)
          if ($psBytes.Length -eq 0 -or ($psBytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
            throw 'emoi.ps1 must remain ASCII-only for Windows PowerShell 5.1.'
          }
          Write-Host 'PASS: CMD ASCII/CRLF and PowerShell ASCII encoding.'
      - name: Run launcher contract tests in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test_windows_launcher.ps1
