# Single-instance backend. Put HTTPS in front of the loopback-only published port.
services:
  lune:
    build:
      context: .
      dockerfile: Dockerfile.lune
    restart: "on-failure:5"
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${LUNE_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      RELAY_SECRET: ${RELAY_SECRET:?Set RELAY_SECRET in the private .env file}
      PORT: "8080"
      RELAY_DB: /data/relay.db
      RELAY_UPLOAD_DIR: /data/uploads
      LOOP_CONFIG: /data/api_loop.config.json
      LOOP_CACHE_DIR: /data/loop_cache
      RELAY_BRAIN_FILE: /data/brain_target
      RELAY_APP_PATH: /
      LUNE_LATENT_AUTO_SETUP: "1"
      LUNE_LATENT_SOURCE: /data/lune-private/latent-source
      LUNE_PASSIVE_MODEL_CACHE: /data/lune-private/latent-models
      LUNE_PASSIVE_STATE_DIR: /data/lune-private/passive-state
      LUNE_LATENT_FULL_DIR: /data/lune-private/latent-full
    volumes:
      - lune_data:/data
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request;assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=4))['ok']"]
      interval: 15s
      timeout: 5s
      start_period: 5m
      retries: 3
volumes:
  lune_data:
